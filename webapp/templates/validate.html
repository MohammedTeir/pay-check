<!DOCTYPE html>
<html>
<head>
    <title>Card Validation</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 40px; max-width: 500px; margin: 0 auto; }
        .container { background: #f6f9fc; padding: 30px; border-radius: 10px; }
        .form-row { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        #card-element { padding: 12px; border: 1px solid #e0e0e0; border-radius: 4px; background: white; }
        #submit-btn { background: #5469d4; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        #submit-btn:hover { background: #4355b9; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💳 Card Validation</h2>
        <form id="payment-form">
            <div class="form-row">
                <label for="card-element">Card Details</label>
                <div id="card-element"></div>
                <div id="card-errors" role="alert" style="color: #e53e3e; margin-top: 8px; font-size: 14px;"></div>
            </div>
            <button id="submit-btn" type="submit">Validate Card</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        const stripe = Stripe('{{ stripe_key }}');
        const elements = stripe.elements();
        const card = elements.create('card', {
            style: {
                base: { fontSize: '16px', color: '#32325d' }
            },
            hidePostalCode: true,
        });
        card.mount('#card-element');

        const form = document.getElementById('payment-form');
        const resultDiv = document.getElementById('result');
        let validationResult = null;

        card.on('change', ({error}) => {
            const displayError = document.getElementById('card-errors');
            if (error) {
                displayError.textContent = error.message;
            } else {
                displayError.textContent = '';
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Validating...';

            try {
                console.log('Creating PaymentMethod...');
                // Create payment method
                const {paymentMethod, error} = await stripe.createPaymentMethod({
                    type: 'card',
                    card: card,
                });

                console.log('createPaymentMethod result:', {
                    hasPaymentMethod: !!paymentMethod,
                    hasError: !!error,
                    paymentMethodId: paymentMethod?.id,
                    errorCode: error?.code,
                    errorMessage: error?.message,
                });

                if (error) {
                    resultDiv.className = 'error';
                    resultDiv.style.display = 'block';
                    resultDiv.textContent = 'Declined: ' + error.message;
                    validationResult = { success: false, error: error.message, code: error.code };
                } else {
                    resultDiv.className = 'success';
                    resultDiv.style.display = 'block';
                    resultDiv.textContent = 'PaymentMethod Created: ' + paymentMethod.id;
                    validationResult = { success: true, id: paymentMethod.id, card: paymentMethod.card };
                }
            } catch (err) {
                console.error('PaymentMethod exception:', err);
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
                resultDiv.textContent = 'Error: ' + err.message;
                validationResult = { success: false, error: err.message };
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Validate Card';
        });

        // Expose result for Playwright automation
        window.getValidationResult = () => validationResult;
        window.clearForm = () => {
            card.clear();
            resultDiv.style.display = 'none';
            validationResult = null;
        };
    </script>
</body>
</html>
